spring.application.name=books

# --- H2 у файлі: ./data/booksdb.mv.db створюється сам, якщо його немає ---
spring.datasource.url=jdbc:h2:file:./data/booksdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# update = створити таблиці, якщо їх немає; існуючі дані не чіпати
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Консоль БД: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Actuator: http://localhost:8080/actuator/health
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Логування
logging.level.root=INFO
logging.level.com.example.books=DEBUG
logging.file.name=logs/books.log